server:
    port: 8080
    servlet:
        context-path: /mymangaapp

spring:
    application:
        name: mymangaapp
    datasource:
        url: ${DB_URL}
        driver-class-name: "com.mysql.cj.jdbc.Driver"
        username: root
        password: ${DB_PASSWORD}
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        open-in-view: false
    servlet:
        multipart:
            max-file-size: 10MB
            max-request-size: 300MB
    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            password: ${REDIS_PASSWORD:}
            database: ${REDIS_DATABASE:0}
            timeout: 5000ms #thời gian tối đa chờ phản hồi lệnh
            connect-timeout: 3000ms #thời gian tối đa chờ kết nối
    jackson:
        mapper:
            accept-case-insensitive-enums: true #cho phép field của body request nhận vào gtrị enum ko pb hoa thường
jwt:
    signer-key: ${SIGNER_KEY}
    access-token-validity-in-seconds: ${ACCESS_TOKEN_VALIDITY_IN_SECONDS}
    refreshable-duration-in-seconds: ${REFRESHABLE_DURATION_IN_SECONDS}

cloud:
    r2:
        credentials:
            access-key-id: ${CLOUDFLARE_R2_ACCESS_KEY_ID}
            secret-access-key: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
        region:
            static: auto
        bucket: ${CLOUDFLARE_R2_BUCKET_NAME}
        s3:
            endpoint-url: ${CLOUDFLARE_R2_ENDPOINT_URL}
            public-url: ${CLOUDFLARE_R2_PUBLIC_URL}

app:
    init:
        admin:
            password: ${INIT_ADMIN_PASSWORD}
        user1:
            password: ${INIT_USER1_PASSWORD}
        user2:
            password: ${INIT_USER2_PASSWORD}
        user3:
            password: ${INIT_USER3_PASSWORD}
    cors:
        allowed-origins: "http://localhost:5173, http://127.0.0.1:5173"

